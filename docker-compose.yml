version: "3.9"

services:
  # ── Application ─────────────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}                   # Required — set in .env
      DATABASE_PATH: /app/data/pdf_system.db
      UPLOAD_FOLDER: /app/storage/uploads
      TEMP_UPLOAD_FOLDER: /app/storage/temp
      PDF_CACHE_FOLDER: /app/storage/cache
      LOG_FILE: /app/logs/app.log
      LOG_JSON: "1"
      REDIS_URL: redis://redis:6379/0
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}           # Required — set in .env
      MAX_UPLOAD_BYTES: "33554432"                # 32 MB
    volumes:
      - pdf_storage:/app/storage
      - pdf_data:/app/data
      - pdf_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Background Worker ────────────────────────────────────────────────────────
  worker:
    build: .
    restart: unless-stopped
    command: >
      sh -c "rq worker pdf_indexing
             --url redis://redis:6379/0"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_PATH: /app/data/pdf_system.db
      UPLOAD_FOLDER: /app/storage/uploads
      TEMP_UPLOAD_FOLDER: /app/storage/temp
      REDIS_URL: redis://redis:6379/0
    volumes:
      - pdf_storage:/app/storage
      - pdf_data:/app/data
    depends_on:
      - redis
    networks:
      - internal

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      - pdf_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pdf_storage:
  pdf_data:
  redis_data:
  pdf_logs:
